version: '3.8'

services:
  api:
    image: webapplication2
    build:
      context: .
      dockerfile: WebApplication2/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=EventManagementDb;User Id=sa;Password=CodeWithArjun123;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=CodeWithArjun123
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CodeWithArjun123 -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s